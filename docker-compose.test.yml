# Test Environment Docker Compose
# Uses different ports than production

version: '3.8'

services:
  # Frontend (Test)
  frontend-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: relist-frontend-test
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://test.relist-app.online/api
    networks:
      - relist-test

  # Backend API (Test)
  server-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: relist-server-test
    restart: unless-stopped
    ports:
      - "3001:3000"  # Different port than prod
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - DOMAIN=test.relist-app.online
      - FRONTEND_URL=http://test.relist-app.online
      - CLIENT_URL=http://test.relist-app.online
      - REDIS_URL=redis://redis-test:6379
    env_file:
      - .env.test
    networks:
      - relist-test
    depends_on:
      - redis-test

  # Redis (Test)
  redis-test:
    image: redis:7-alpine
    container_name: relist-redis-test
    restart: unless-stopped
    volumes:
      - redis-test-data:/data
    networks:
      - relist-test

  # Nginx (Test)
  nginx-test:
    image: nginx:alpine
    container_name: relist-nginx-test
    restart: unless-stopped
    ports:
      - "8080:80"  # Different port than prod
    volumes:
      - ./docker/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-test
      - server-test
    networks:
      - relist-test

networks:
  relist-test:
    driver: bridge

volumes:
  redis-test-data:
