version: '3.8'

# =============================================================================
# RELIST - Production Deployment with SSL
# =============================================================================
# For EC2 deployment with automatic HTTPS via Let's Encrypt
#
# Prerequisites:
#   1. Domain name pointing to your EC2 instance
#   2. Ports 80 and 443 open in security group
#   3. .env file configured with your secrets
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ===========================================================================
  # REDIS - Cache & Job Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: relist-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - relist-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # SERVER - Backend API
  # ===========================================================================
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: relist-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Database
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # URLs (set based on environment)
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN}}
      CLIENT_URL: ${CLIENT_URL:-https://${DOMAIN}}
      # Optional services
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@relist.app}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_REDIRECT_URI: ${EBAY_REDIRECT_URI:-}
      EBAY_APP_ID: ${EBAY_APP_ID:-}
      EBAY_CERT_ID: ${EBAY_CERT_ID:-}
      EBAY_ENV: ${EBAY_ENV:-PRODUCTION}
      EBAY_VERIFICATION_TOKEN: ${EBAY_VERIFICATION_TOKEN:-}
    networks:
      - relist-network
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # FRONTEND - React App with Nginx
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: relist-frontend
    restart: unless-stopped
    networks:
      - relist-network
    depends_on:
      server:
        condition: service_healthy

  # ===========================================================================
  # NGINX - Reverse Proxy with SSL
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: relist-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.${NODE_ENV:-production}.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl.conf:/etc/nginx/ssl.conf:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - relist-network
    depends_on:
      - frontend
      - server
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # CERTBOT - SSL Certificate Management
  # ===========================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: relist-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run certificate renewal check daily
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

# =============================================================================
# VOLUMES - Persistent Data
# =============================================================================
volumes:
  redis_data:
    name: relist-redis-data
  uploads_data:
    name: relist-uploads
  certbot_data:
    name: relist-certbot-data
  certbot_www:
    name: relist-certbot-www

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  relist-network:
    name: relist-network
    driver: bridge
